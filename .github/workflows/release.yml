name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本标签（与 package.json 一致）
        required: true
        type: string
      draft:
        description: 仅生成草稿，暂不公开 Release
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      KEEP_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 读取版本标签
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          submodules: recursive
          persist-credentials: false

      - name: 验证版本并生成发布说明
        run: |
          node scripts/release-notes.mjs "$env:RELEASE_TAG" > "$env:RUNNER_TEMP/release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw '发布版本检查失败' }

      - name: 准备独立 Node 运行时
        run: |
          $version = '24.21.0'
          $archive = "$env:RUNNER_TEMP/node.zip"
          Invoke-WebRequest "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath "$env:RUNNER_TEMP/bridge-runtime"
          "$env:RUNNER_TEMP/bridge-runtime/node-v$version-win-x64" >> $env:GITHUB_PATH

      - name: 准备构建依赖
        run: |
          node scripts/prepare-release.mjs
          if ($LASTEXITCODE -ne 0) { throw '依赖准备失败' }

      - name: 准备 NSIS
        run: |
          $archive = "$env:RUNNER_TEMP/nsis.zip"
          node --input-type=module -e "import { writeFileSync } from 'node:fs'; const response = await fetch('https://netix.dl.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip'); if (!response.ok) throw new Error('NSIS download HTTP ' + response.status); writeFileSync(process.env.RUNNER_TEMP + '/nsis.zip', Buffer.from(await response.arrayBuffer()));"
          if ($LASTEXITCODE -ne 0) { throw 'NSIS 下载失败' }
          Expand-Archive -LiteralPath $archive -DestinationPath "$env:RUNNER_TEMP/nsis"
          "MAKENSIS=$env:RUNNER_TEMP/nsis/nsis-3.11/makensis.exe" >> $env:GITHUB_ENV

      - name: 检查接入点与兼容层类型
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw '上游接入检查失败' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw '类型检查失败' }

      - name: 构建 Windows x64 安装包
        run: |
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { throw '安装包构建失败' }

      - name: 创建或继续草稿 Release
        run: |
          $json = gh release view "$env:RELEASE_TAG" --json isDraft
          if ($LASTEXITCODE -eq 0) {
            if (-not ($json | ConvertFrom-Json).isDraft) { throw '此版本已公开，请使用新的版本标签' }
            gh release edit "$env:RELEASE_TAG" --notes-file "$env:RUNNER_TEMP/release-notes.md"
          } else {
            $flags = @('--draft', '--verify-tag')
            if ($env:RELEASE_TAG.Contains('-')) { $flags += '--prerelease' }
            gh release create "$env:RELEASE_TAG" --title "OpenCode Piggy $env:RELEASE_TAG" --notes-file "$env:RUNNER_TEMP/release-notes.md" @flags
          }
          if ($LASTEXITCODE -ne 0) { throw '草稿 Release 准备失败' }

      - name: 上传完整安装包
        run: |
          $project = Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json
          $game = Get-Content upstream/dsh-piggy/package.json -Raw -Encoding utf8 | ConvertFrom-Json
          $installer = "dist/opencode-piggy-setup-game-$($game.version)-$($project.version)-x64.exe"
          if (-not (Test-Path $installer)) { throw '安装包不存在' }
          gh release upload "$env:RELEASE_TAG" $installer --clobber
          if ($LASTEXITCODE -ne 0) { throw '安装包上传失败，Release 保留为草稿' }

      - name: 公开 Release
        if: env.KEEP_DRAFT != 'true'
        run: |
          gh release edit "$env:RELEASE_TAG" --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release 发布失败' }
